<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7" />
    </linearGradient>

    <!-- Letter D Vibrant Gradient -->
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.2" />

  <!-- Inner Ambient Glow Ring -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

  <!-- Bold, Modern Typographic 'D' with Even Thickness -->
  <path
    d="M 18,14 H 34 C 43,14 49,21 49,32 C 49,43 43,50 34,50 H 18 Z M 27,22 V 42 H 33 C 38,42 41,38 41,32 C 41,26 38,22 33,22 Z"
    fill="url(#dGrad)"
    filter="url(#glow)"
  />

  <!-- Subtle Cyber Node Spark (Tech / AI Accent) -->
  <circle cx="47" cy="18" r="3.2" fill="#38bdf8" />
  <circle cx="47" cy="18" r="1.5" fill="#ffffff" />
</svg>